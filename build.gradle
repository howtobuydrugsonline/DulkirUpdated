import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
  	id "org.jetbrains.kotlin.jvm" version "2.4.10"
	id "org.jetbrains.kotlin.plugin.serialization" version "2.4.10"
}

// Minecraft 26.1 targets Java 25, so javac needs `--release 25`. On an older JDK
// that surfaces as "error: release version 25 not supported", which does not
// hint at the cause — fail early with something actionable instead.
def runningJava = Integer.parseInt(JavaVersion.current().majorVersion)
if (runningJava < 25) {
	throw new GradleException(
		"This project needs Java 25 or newer to build (Minecraft 26.1 targets Java 25),\n" +
		"but Gradle is running on Java ${runningJava}.\n\n" +
		"Point JAVA_HOME at a JDK 25+ install and try again, for example:\n" +
		"  Windows (PowerShell):  \$env:JAVA_HOME = \"C:\\Path\\To\\jdk-25\"\n" +
		"  Linux / macOS:         export JAVA_HOME=/path/to/jdk-25\n\n" +
		"Or point this one build at it:\n" +
		"  ./gradlew build -Dorg.gradle.java.home=/path/to/jdk-25"
	)
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Jarvis is built from ../jarvis-fabric (upstream has no 26.x release) and
	// installed with `gradlew publishToMavenLocal` over there.
	mavenLocal()
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }
	maven { url "https://repo.nea.moe/mirror" }
	maven { url "https://repo.nea.moe/releases/" }
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url = "https://jitpack.io/" }
    maven {
        url "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }
}

// MC 26.1+ ships unobfuscated, so the `mappings` line is gone and the new
// net.fabricmc.fabric-loom plugin does not remap. That means every `mod*`
// configuration collapses into its plain Gradle equivalent.
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	runtimeOnly("me.djtheredstoner:DevAuth-fabric:${project.devAuth_version}")
	implementation "meteordevelopment:orbit:${project.orbit_version}"
	include "meteordevelopment:orbit:${project.orbit_version}"
	api "me.shedaniel.cloth:cloth-config-fabric:${project.clothConfig_version}"
	include "me.shedaniel.cloth:cloth-config-fabric:${project.clothConfig_version}"
	implementation "moe.nea.jarvis:jarvis-fabric:${project.jarvis_version}"
	include "moe.nea.jarvis:jarvis-fabric:${project.jarvis_version}"
	localRuntime "moe.nea.jarvis:jarvis-fabric:${project.jarvis_version}"
    implementation "maven.modrinth:modmenu:${project.modMenu_version}"
    localRuntime "maven.modrinth:modmenu:${project.modMenu_version}"
}

loom {
	runs {
		removeIf { it.name != "client" }
		named("client") {
			// DevAuth hard-fails the launch when no account is configured, which
			// blocks even an offline smoke test. Opt in with -Pdevauth=true once
			// you've set up ~/.devauth/config.toml.
			property("devauth.enabled", project.findProperty("devauth") ?: "false")
			property("fabric.log.level", "info")
			vmArg("-ea")
		}
	}
	accessWidenerPath = file("src/main/resources/dulkirmod.accesswidener")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

tasks.withType(KotlinCompile).configureEach {
	compilerOptions.jvmTarget = JvmTarget.JVM_25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}"}
	}
}
