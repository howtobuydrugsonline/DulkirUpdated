# Builds the mod and publishes it as a GitHub Release whenever a version tag is
# pushed, so users can download a ready-made jar instead of building it.
#
#   git tag v1.1.4-26.1.2
#   git push origin v1.1.4-26.1.2

name: release

on:
  push:
    tags:
      - 'v*'
  # Also runnable by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.1.4-26.1.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk 25
        uses: actions/setup-java@v4
        with:
          java-version: 25   # Minecraft 26.1 targets Java 25
          distribution: 'temurin'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      # The sources jar is for developers; players only want the mod itself.
      - name: collect the mod jar
        id: jar
        run: |
          JAR=$(find build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          if [ -z "$JAR" ]; then echo "No mod jar found in build/libs"; ls -la build/libs; exit 1; fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Built $JAR"

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" "${{ steps.jar.outputs.path }}" \
            --title "DulkirMod $TAG" \
            --notes "$(cat <<'NOTES'
          Unofficial fork of [DulkirMod-Fabric](https://github.com/inglettronald/DulkirMod-Fabric) for **Minecraft 26.1.2**.

          ### Install
          1. [Fabric Loader](https://fabricmc.net/use/installer) 0.19.3+ for Minecraft 26.1.2
          2. Drop these into `.minecraft/mods`:
             - the jar attached below
             - [Fabric API](https://modrinth.com/mod/fabric-api) `0.155.2+26.1.2`
             - [Fabric Language Kotlin](https://modrinth.com/mod/fabric-language-kotlin) `1.13.13+`

          Cloth Config, Orbit and Jarvis are bundled inside the jar - do not download those separately.

          ### Requires Java 25 or newer
          Minecraft 26.1 needs Java 25. If the mod does not appear in-game, this is almost always why.

          ### Note
          Hypixel-specific features are not fully tested. Please open an issue if something misbehaves.
          NOTES
          )" || gh release upload "$TAG" "${{ steps.jar.outputs.path }}" --clobber
