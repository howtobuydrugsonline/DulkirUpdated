plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// See the note in the root build.gradle: javac needs --release 25 for Minecraft
// 26.1, and an older JDK reports that unhelpfully.
def runningJava = Integer.parseInt(JavaVersion.current().majorVersion)
if (runningJava < 25) {
	throw new GradleException(
		"This project needs Java 25 or newer to build (Minecraft 26.1 targets Java 25),\n" +
		"but Gradle is running on Java ${runningJava}.\n\n" +
		"Point JAVA_HOME at a JDK 25+ install and try again, for example:\n" +
		"  Windows (PowerShell):  \$env:JAVA_HOME = \"C:\\Path\\To\\jdk-25\"\n" +
		"  Linux / macOS:         export JAVA_HOME=/path/to/jdk-25\n\n" +
		"Or point this one build at it:\n" +
		"  ./gradlew build -Dorg.gradle.java.home=/path/to/jdk-25"
	)
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

// MC 26.1+ ships unobfuscated: no `mappings` line, and the fabric-loom plugin
// does not remap, so plain Gradle configurations replace the `mod*` ones.
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("COPYING") { rename { "${it}_${base.archivesName.get()}" } }
	from("COPYING.LESSER") { rename { "${it}_${base.archivesName.get()}" } }
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
